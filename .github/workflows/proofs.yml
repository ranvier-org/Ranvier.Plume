name: Plume proofs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 4.14.2
      - name: Install the Ranvier proof toolchain
        run: |
          opam repository add rocq-released https://rocq-prover.org/opam/released
          opam repository add iris-dev git+https://gitlab.mpi-sws.org/iris/opam.git
          opam install --yes rocq-core.9.1.0 rocq-stdlib.9.2.0 rocq-stdpp.1.13.0 rocq-iris-heap-lang.4.5.0
      - name: Compile, audit and compare with the release assemblies
        run: opam exec -- bash proofs/check.sh
