name: Plume proofs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: plume-proofs-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install opam and native build dependencies
        run: sudo apt-get update && sudo apt-get install -y opam libgmp-dev pkg-config unzip bubblewrap
      - uses: actions/cache@v4
        id: toolchain
        with:
          path: ~/.opam
          key: plume-proof-tools-${{ runner.os }}-${{ runner.arch }}-4.14.2-9.1.0-9.2.0-1.13.0-4.5.0
      - name: Install the Ranvier proof toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        env:
          OPAMYES: '1'
        run: |
          opam init --bare --disable-sandboxing --no-setup
          opam switch create ranvier-proofs ocaml-base-compiler.4.14.2
          eval "$(opam env --switch=ranvier-proofs --set-switch)"
          opam repository add rocq-released https://rocq-prover.org/opam/released
          opam repository add iris-dev git+https://gitlab.mpi-sws.org/iris/opam.git
          opam install rocq-core.9.1.0 rocq-stdlib.9.2.0 rocq-stdpp.1.13.0 rocq-iris-heap-lang.4.5.0
          opam clean --download-cache --logs --repo-cache --untracked
      - name: Compile, audit and compare with the release assemblies
        run: opam exec --switch=ranvier-proofs -- bash proofs/check.sh
