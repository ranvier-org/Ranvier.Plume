name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build and test core and native view
        run: dotnet fsi --exec build.fsx -- ci
      - name: Test traced libraries
        run: dotnet fsi --exec build.fsx -- traced
      - name: Pack both library families
        shell: pwsh
        run: |
          foreach ($trace in 'false','true') {
            foreach ($id in 'Ranvier.Plume','Ranvier.Plume.View') {
              dotnet pack "src/$id/$id.fsproj" -c Release "-p:RanvierTrace=$trace" -o artifacts/packages
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
          }
      - name: Inspect package identities, contents and dependencies
        run: ./scripts/check-packages.ps1 -Directory artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
